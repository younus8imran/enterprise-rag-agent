[tool.poetry]
name = "enterprise-intelligence-agent"
version = "0.1.0"
description = "Enterprise Agentic RAG + Research + SQL Platform"
authors = ["Imran <imran@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = {extras = ["hiredis"], version = "^5.0.8"}
structlog = "^24.4.0"
python-dotenv = "^1.0.1"
pgvector = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
mypy = "^1.11.0"
flake8 = "^7.1.0"
black = "^24.8.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
