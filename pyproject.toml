[project]
name = "enterprise-intelligence-agent"
version = "0.1.0"
description = "Enterprise Agentic RAG + Research + SQL Platform"
authors = [{name = "Imran", email = "imran@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.8",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "pgvector>=0.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "psycopg2-binary>=2.9.12",
    "psycopg2>=2.9.12",
    "langgraph>=1.2.11",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "mistralai>=1.5.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "flake8>=7.1.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "flake8>=7.1.0",
    "black>=24.8.0",
    "isort>=5.13.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
